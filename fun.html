<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A tiny birthday pick for Iqra</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script><style>.quiz-options{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:850px;margin:30px auto 20px}.quiz-option{border:1px solid white;background:rgba(255,255,255,.78);border-radius:25px;padding:28px 15px;box-shadow:0 12px 35px #876c9410;cursor:pointer;transition:.3s}.quiz-option:hover,.quiz-option.chosen{transform:translateY(-6px);box-shadow:var(--shadow);background:linear-gradient(145deg,#fff,#fff0f6);border-color:#e8bfd2}.quiz-option b{display:block;font:600 1.2rem var(--serif);margin-top:12px}.quiz-option span{font-size:2.4rem}.quiz-result{display:none;max-width:620px;margin:25px auto;padding:24px;border-radius:24px;background:#fff9;border:1px solid white;box-shadow:var(--shadow);color:#886e8d;line-height:1.8}.quiz-result.show{display:block;animation:rise .5s both}@media(max-width:650px){.quiz-options{grid-template-columns:1fr}}</style></head><body data-page="fun"><main class="wrap"><header class="page-hero"><span class="eyebrow">Just for fun · no wrong answers</span><h1>Pick your <em class="gradient">birthday vibe.</em></h1><p>Chalo ek tiny sa birthday question! Jo option tumhe sabse zyada pasand ho, us par tap karo. 🎀</p></header><section style="padding:0 0 90px;text-align:center"><h2 class="serif">Perfect birthday mood kya hai?</h2><div class="quiz-options"><button class="quiz-option" data-answer="cake"><span>🍰</span><b>Cake & treats</b><small class="muted">Sweet tooth mode on</small></button><button class="quiz-option" data-answer="music"><span>🎶</span><b>Music & chill</b><small class="muted">Favourite songs all day</small></button><button class="quiz-option" data-answer="flowers"><span>🌷</span><b>Flowers & surprises</b><small class="muted">Soft, pretty moments</small></button></div><div class="quiz-result" id="quizResult">Your birthday vibe is ready ♡</div></section></main></body></html>
